<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b1324" />
    <title>Chittoor District | AP Resurvey Monitoring</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar" aria-label="Primary navigation">
        <div class="brand-block">
          <div class="district-mark" aria-hidden="true"><span></span><i></i><b></b></div>
          <div><p class="eyebrow">CHITTOOR DISTRICT</p><h1>Resurvey<br />Monitoring</h1></div>
        </div>
        <nav class="primary-nav">
          <button class="nav-link active" data-view="dashboard"><svg><use href="#icon-grid" /></svg>Overview</button>
          <button class="nav-link" data-view="villages"><svg><use href="#icon-map" /></svg>Village monitoring</button>
          <button class="nav-link" data-view="performance"><svg><use href="#icon-chart" /></svg>Performance</button>
          <button class="nav-link" data-view="quality"><svg><use href="#icon-shield" /></svg>Data quality</button>
          <button class="nav-link" data-view="reports"><svg><use href="#icon-document" /></svg>Reports</button>
          <div class="nav-label">ADMINISTRATION</div>
          <button class="nav-link" data-view="sources"><svg><use href="#icon-database" /></svg>Data sources</button>
          <button class="nav-link" data-view="audit"><svg><use href="#icon-history" /></svg>Audit history</button>
        </nav>
        <div class="sidebar-foot">
          <div class="user-avatar">AD</div><div><strong>Revenue Officer</strong><span>District access</span></div>
          <button id="lock-session-btn" class="lock-button" title="Lock session / Logout" aria-label="Lock session"><svg><use href="#icon-shield" /></svg></button>
        </div>
      </aside>
      <main class="main-content">
        <header class="topbar">
          <button id="mobile-menu" class="icon-button mobile-only" aria-label="Open menu"><svg><use href="#icon-menu" /></svg></button>
          <div class="page-context"><span id="breadcrumb">MONITORING CENTRE</span><h2 id="page-title">District overview</h2></div>
          <div class="top-actions">
            <div class="updated-stamp"><span>LAST UPDATED</span><strong id="last-updated">Not synchronized</strong></div>
            <button id="source-status" class="source-status" title="View data source status"><span class="status-dot neutral"></span><span id="source-status-label">Sources not connected</span></button>
            <button id="refresh-button" class="refresh-button"><svg><use href="#icon-refresh" /></svg><span>Refresh data</span></button>
          </div>
        </header>
        <section id="view-root" class="view-root" aria-live="polite"></section>
      </main>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root" class="toast-root"></div>

    <svg class="svg-sprite" aria-hidden="true">
      <symbol id="icon-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></symbol>
      <symbol id="icon-map" viewBox="0 0 24 24"><path d="m9 18-6 3V6l6-3 6 3 6-3v15l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/></symbol>
      <symbol id="icon-chart" viewBox="0 0 24 24"><path d="M4 19V5M4 19h17"/><path d="m7 15 4-4 3 2 5-6"/></symbol>
      <symbol id="icon-shield" viewBox="0 0 24 24"><path d="M12 3 4.5 6v5c0 4.6 3.2 8.8 7.5 10 4.3-1.2 7.5-5.4 7.5-10V6L12 3Z"/><path d="m9 12 2 2 4-4"/></symbol>
      <symbol id="icon-document" viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
      <symbol id="icon-database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v7c0 1.7 3.6 3 8 3s8-1.3 8-3V5M4 12v7c0 1.7 3.6 3 8 3s8-1.3 8-3v-7"/></symbol>
      <symbol id="icon-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5M12 7v5l3 2"/></symbol>
      <symbol id="icon-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 0 0-14.8-4.2L3 9"/><path d="M3 4v5h5M4 13a8 8 0 0 0 14.8 4.2L21 15"/><path d="M16 15h5v5"/></symbol>
      <symbol id="icon-arrow" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
      <symbol id="icon-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6"/><path d="m16 16 4 4"/></symbol>
      <symbol id="icon-sliders" viewBox="0 0 24 24"><path d="M4 7h16M4 17h16M8 4v6M16 14v6"/></symbol>
      <symbol id="icon-download" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></symbol>
      <symbol id="icon-external" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M19 14v5H5V5h5"/></symbol>
      <symbol id="icon-close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
      <symbol id="icon-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></symbol>
      <symbol id="icon-warning" viewBox="0 0 24 24"><path d="M12 3 2.8 20h18.4L12 3Z"/><path d="M12 9v4M12 17h.01"/></symbol>
      <symbol id="icon-link" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.1.1l2-2a5 5 0 0 0-7.1-7.1l-1.1 1.1"/><path d="M14 11a5 5 0 0 0-7.1-.1l-2 2A5 5 0 0 0 12 20l1.1-1.1"/></symbol>
    </svg>
    <script src="/app.js"></script>
  </body>
</html>
